[project]
name = "netauto-lab"
version = "0.1.0"
description = "Lab de automação de rede: NetBox -> Python/Ansible -> SR Linux, com checks e drift"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
