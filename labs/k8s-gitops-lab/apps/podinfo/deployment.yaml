# Fonte da verdade do que roda no namespace "demo". Mude aqui, faça push, e o Argo CD aplica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels: { app: podinfo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: podinfo }
  template:
    metadata:
      labels: { app: podinfo }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: "netlab: deploy via GitOps"
          resources:
            requests: { cpu: 50m, memory: 64Mi }   # reserva no agendamento
            limits: { cpu: 200m, memory: 128Mi }   # teto; passou da memória = OOMKilled
          readinessProbe:                          # fora do Service até ficar pronto
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:                           # reinicia se travar
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
